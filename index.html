<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>Frank-Y</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:100vw;height:100vh;height:100dvh}
  #gear{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.07);color:rgba(255,255,255,.35);font-size:22px;z-index:3}
  #panel{position:fixed;left:0;right:0;bottom:0;padding:12px 12px max(12px,env(safe-area-inset-bottom));background:rgba(18,18,26,.94);display:none;flex-wrap:wrap;gap:8px;justify-content:center;z-index:2;font-family:system-ui,-apple-system,sans-serif}
  #panel.open{display:flex}
  #panel button{border:0;border-radius:999px;padding:10px 14px;background:#2a2a38;color:#fff;font-size:15px}
  #panel button.on{background:#5ad8ff;color:#000}
  #panel .sep{flex-basis:100%;height:0}
  #status{position:fixed;left:14px;right:70px;top:max(14px,env(safe-area-inset-top));color:rgba(255,255,255,.8);font:15px system-ui,sans-serif;z-index:3;pointer-events:none;transition:opacity .6s}
  video{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}
  #panel input{flex:1 1 220px;padding:10px 14px;border-radius:999px;border:0;background:#2a2a38;color:#fff;font-size:16px}
  #mic{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:68px;height:68px;border-radius:50%;border:0;background:rgba(255,255,255,.08);font-size:30px;z-index:3;transition:background .2s,transform .2s}
  #mic.on{background:rgba(90,216,255,.4);transform:translateX(-50%) scale(1.12)}
  #mic.busy{opacity:.35}
  #mic.convo{background:rgba(90,216,255,.18);box-shadow:0 0 0 3px rgba(90,216,255,.35)}
  #panel.open + #mic{display:none}
  #visa{position:fixed;left:0;right:0;top:35%;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 80px);display:flex;align-items:center;justify-content:center;
        opacity:0;transform:translateY(24px);transition:opacity .45s,transform .45s;pointer-events:none;z-index:1;
        color:#fff;font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;font-weight:700;text-align:center}
  #visa.on{opacity:1;transform:none}
  #visa.sing .bild{animation:hopp .5s ease-in-out infinite alternate}
  #visa.sing .text{font-size:min(9vh,6.5vw)}
  #visa .text.liten{font-size:min(6.5vh,5vw);opacity:.75}
  @keyframes hopp{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-1.2vh) rotate(4deg)}}
  #sheet{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:10;padding:16px;
         font-family:system-ui,-apple-system,sans-serif;color:#fff}
  #sheet.open{display:flex}
  #sheet .box{background:#16161f;border-radius:18px;width:min(640px,100%);max-height:100%;display:flex;flex-direction:column;gap:10px;padding:16px;box-sizing:border-box}
  #sheet h3{margin:0;font-size:18px}
  #sheet p{margin:0;color:#aab;font-size:14px}
  #sheet .body{overflow:auto;flex:1;min-height:80px}
  #sheet textarea{width:100%;min-height:180px;box-sizing:border-box;border:0;border-radius:12px;padding:12px;background:#24243a;color:#fff;font-size:16px;font-family:inherit;resize:vertical}
  #sheet .mem{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #2a2a3a;font-size:15px}
  #sheet .mem span{flex:1}
  #sheet button{border:0;border-radius:999px;padding:10px 16px;background:#2a2a38;color:#fff;font-size:15px}
  #sheet button.primary{background:#5ad8ff;color:#000}
  #sheet .mem button{padding:6px 10px;background:#3a2430}
  #sheet .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
  #visa .inner{display:flex;flex-direction:column;align-items:center;gap:1.6vh;transform-origin:center}
  #visa .bild{font-size:min(17vh,13vw);line-height:1.1;letter-spacing:.05em}
  #visa .text{font-size:min(11vh,8vw);line-height:1.1;color:var(--vc,#5ad8ff);text-shadow:0 0 18px rgba(90,216,255,.35)}
  #visa .stava{display:flex;gap:1.2vh}
  #visa .stava span{display:inline-flex;align-items:center;justify-content:center;width:min(11vh,9vw);height:min(13vh,11vw);border-radius:14px;
        background:rgba(90,216,255,.16);font-size:min(9vh,7vw);opacity:0;transform:scale(.4);transition:opacity .3s,transform .3s}
  #visa .stava span.in{opacity:1;transform:none}
  #visa .val{display:flex;gap:2vh;flex-wrap:wrap;justify-content:center}
  #visa .val button{pointer-events:auto;border:0;border-radius:18px;min-width:min(16vh,18vw);padding:1.4vh 2.4vh;font:inherit;font-size:min(7vh,6vw);
        background:#23324a;color:#fff;box-shadow:0 0 0 2px rgba(90,216,255,.35);transition:background .2s,transform .2s}
  #visa .val button:active{transform:scale(.94)}
  #visa .val button.ratt{background:#1f9d57;box-shadow:0 0 0 3px #6ff0a8}
  #visa .val button.fel{background:#7a2e3a;opacity:.6}
</style>
</head>
<body>
<canvas id="c"></canvas>
<video id="v" playsinline muted autoplay></video>
<div id="status"></div>
<button id="gear" aria-label="Inställningar">⚙</button>
<div id="visa"><div class="inner"></div></div>
<div id="panel"></div>
<div id="sheet"><div class="box"></div></div>
<button id="mic" aria-label="Prata med Frank-Y">🎤</button>

<script>
// ============================================================
//  FRANK-Y – robotögon
//  Styr från annan kod:  robot.setEmotion('glad')
//                        robot.setEmotion('förvånad', 1500)  // tillfälligt
//                        robot.lookAt(0.5, -0.2, 1000)       // x,y i -1..1
// ============================================================

// ---------- Uttryck ----------
// Per öga: w/h = storlek, r = rundhet, y = höjdläge,
// lid = övre ögonlock (0-1), tilt = lutning (+ arg, - ledsen),
// bot = undre lock, smile = glad båge underifrån, heart = hjärtöga
// bA/bY/bT/bC = ögonbryn: synlighet, höjd, lutning (+ arg, - ledsen), böj
const E = o => Object.assign({w:1,h:1,r:.38,y:0,lid:0,tilt:0,bot:0,smile:0,heart:0,bA:0,bY:0,bT:0,bC:.18}, o||{});
// jiggle = skakskratt, shiver = darrar, sway = vaggar, spin = ögonen går runt
const G = {bg:0, color:[90,220,255], blush:0, roll:0, bounce:0, gx:0, gy:0, talk:0, speed:8, jiggle:0, shiver:0, sway:0, spin:0};

const EXPR = {
  neutral:  {L:{}},
  glad:     {L:{h:.95,smile:.55}, color:[110,235,255], blush:.55, bounce:.3},
  ledsen:   {L:{h:.9,lid:.32,tilt:-.45,y:.08,bA:1,bY:.03,bT:-.5,bC:.1}, color:[90,140,255], gy:.4, speed:4},
  förvånad: {L:{w:1.12,h:1.22,r:.5,bA:1,bY:.06,bC:.38}, color:[150,240,255], gy:-.1, speed:14},
  arg:      {L:{h:.9,lid:.32,tilt:.5,bA:1,bY:-.06,bT:.55,bC:.04}, color:[255,90,80], speed:10},
  sömnig:   {L:{lid:.62,bot:.08,tilt:-.1}, color:[80,160,210], gy:.25, speed:2.5},
  kär:      {L:{heart:1}, color:[255,105,170], blush:1, bounce:.15},
  nyfiken:  {L:{w:1.05,h:1.15,bA:1,bY:.07,bC:.32}, R:{h:.82,lid:.2,tilt:.15,bA:.6,bY:-.02,bT:.1,bC:.08}, roll:-8, color:[100,230,255]},
  tänker:   {L:{lid:.22,tilt:-.15,bA:.8,bY:.06,bT:-.1,bC:.25}, R:{lid:.12,h:.95,bA:.5,bY:.04,bC:.15}, gx:.55, gy:-.55, color:[120,200,255]},
  lyssnar:  {L:{w:1.05,h:1.08,r:.45}, roll:6, color:[100,240,225]},
  pratar:   {L:{smile:.2}, color:[100,230,255], talk:1},
  // ---- fler uttryck ----
  blunda:   {L:{lid:1}, color:[90,220,255], speed:6},
  skrattar: {L:{h:.9,smile:.72}, color:[120,240,255], blush:.6, bounce:.6, jiggle:1, speed:12},
  blinka:   {L:{h:.95,smile:.2}, R:{h:.85,smile:.9}, color:[110,235,255], blush:.35, roll:-5},
  rädd:     {L:{w:.85,h:1.12,r:.5,bA:1,bY:.05,bT:-.38,bC:.22}, color:[175,210,255], shiver:1, gy:.1, speed:14},
  förvirrad:{L:{h:1.1,bA:1,bY:.06,bT:-.1,bC:.32}, R:{h:.8,lid:.3,tilt:-.3,bA:1,bY:-.03,bT:.28,bC:.05}, color:[160,200,255], roll:10, sway:1},
  blyg:     {L:{h:.85,lid:.15,smile:.25}, color:[140,215,255], blush:1, gx:.5, gy:.45, roll:8, speed:5},
  stolt:    {L:{h:.95,lid:.35,tilt:-.05,smile:.3,bA:.7,bY:.07,bT:-.12,bC:.2}, color:[120,240,220], gy:-.25, roll:-4},
  uttråkad: {L:{h:.95,lid:.5,bA:.8,bY:-.05,bC:0}, color:[110,170,200], gx:-.5, gy:.1, speed:4},
  yr:       {L:{}, color:[200,200,255], spin:1, sway:.6, speed:6},
  busig:    {L:{lid:.22,tilt:.12,smile:.45,bA:1,bY:.02,bT:.18,bC:.1}, R:{lid:.05,smile:.45,bA:1,bY:.06,bT:-.12,bC:.28}, color:[150,255,200], roll:6, gx:.3},
  // superkänslor – hela skärmen färgas
  rasande:  {L:{h:.82,lid:.42,tilt:.75,bA:1,bY:-.13,bT:1.9,bC:-.05}, color:[255,55,40], bg:1, shiver:1.6, speed:12},
  jätteledsen:{L:{h:.88,lid:.3,tilt:-.6,y:.06,bA:1,bY:.04,bT:-1.4,bC:.12}, color:[110,150,255], bg:.6, gy:.25, shiver:.35, speed:6},
  sjunger:  {L:{h:.95,smile:.45}, color:[130,240,255], blush:.4, bounce:1, sway:.7, speed:10},
};
for (const n in EXPR) {
  const e = EXPR[n];
  EXPR[n] = Object.assign({}, G, e, {L:E(e.L), R:E(e.R || e.L)});
}
// AI:n kan svara på engelska eller utan å/ä/ö – det funkar ändå
const ALIAS = {happy:'glad',joy:'glad',sad:'ledsen',surprised:'förvånad',forvanad:'förvånad',angry:'arg',
  sleepy:'sömnig',tired:'sömnig',somnig:'sömnig',love:'kär',kar:'kär',curious:'nyfiken',
  thinking:'tänker',tanker:'tänker',listening:'lyssnar',talking:'pratar',speaking:'pratar',
  blundar:'blunda',closed:'blunda',sleep:'blunda',skratta:'skrattar',laughing:'skrattar',laugh:'skrattar',
  wink:'blinka',blinkar:'blinka',scared:'rädd',radd:'rädd',afraid:'rädd',confused:'förvirrad',forvirrad:'förvirrad',
  furious:'rasande',jättearg:'rasande',superarg:'rasande',jattearg:'rasande',
  crying:'jätteledsen',jatteledsen:'jätteledsen',supersad:'jätteledsen',gråter:'jätteledsen',
  shy:'blyg',proud:'stolt',bored:'uttråkad',uttrakad:'uttråkad',dizzy:'yr',mischievous:'busig',playful:'busig'};

// ---------- Inställningar (sparas i telefonen) ----------
const store = {
  get(k,d){ try{ const v=localStorage.getItem('pixel.'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('pixel.'+k, JSON.stringify(v)); }catch(e){} }
};
let mirror = store.get('mirror', false);
let autoMode = store.get('auto', true);

// ---------- Canvas ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const oc = document.createElement('canvas'), octx = oc.getContext('2d');
let W, H, DPR;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
}
addEventListener('resize', resize); resize();

const rand = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const clone = o => JSON.parse(JSON.stringify(o));

// ---------- Tillstånd ----------
let cur = clone(EXPR.neutral), target = EXPR.neutral;
let emotion = 'neutral', baseEmotion = 'neutral', tempTimer = null, tempActive = false;
let changeAt = 0;

function norm(name){
  name = String(name||'').toLowerCase().trim();
  return EXPR[name] ? name : (ALIAS[name] || 'neutral');
}
function apply(name){
  if (name !== emotion){ changeAt = performance.now(); if (Math.random()<.5) startBlink(); }
  emotion = name; target = EXPR[name]; updateButtons();
  const mb = document.getElementById('mic'); if (mb) mb.style.opacity = name === 'blunda' ? '.12' : '';
}
// Spelar en sekvens av tillfälliga uttryck, återgår sedan till grunduttrycket
function play(seq){
  clearTimeout(tempTimer); let i = 0; tempActive = true;
  const step = () => {
    if (i >= seq.length){ tempActive = false; apply(baseEmotion); return; }
    const [n, ms] = seq[i++]; apply(norm(n)); tempTimer = setTimeout(step, ms);
  };
  step();
}
function setEmotion(name, ms){
  if (ms) return play([[name, ms]]);
  clearTimeout(tempTimer); tempActive = false;
  baseEmotion = norm(name); autoSlept = false; apply(baseEmotion);
}

function lerpObj(a, b, k){
  for (const key in b){
    const v = b[key];
    if (typeof v === 'number') a[key] += (v - a[key]) * k;
    else if (Array.isArray(v)) for (let i=0;i<v.length;i++) a[key][i] += (v[i]-a[key][i]) * k;
    else if (v && typeof v === 'object') lerpObj(a[key], v, k);
  }
}

// ---------- Blinkning ----------
// Olika sorters blinkningar: vanlig, halv, långsam "jag gillar dig"-blink (som katter) och nervös
let blink = 0, blinkStart = -1, blinkDur = .15, blinkAmp = 1, blinkHold = 0, blinkAgain = 0, nextBlink = performance.now() + 2000;
function startBlink(kind){
  if (blinkStart >= 0) return;
  blinkStart = performance.now(); blinkAmp = 1; blinkHold = 0;
  if (kind === 'half'){ blinkAmp = .45; blinkDur = .2; }
  else if (kind === 'slow'){ blinkDur = .75; blinkHold = .35; }
  else if (kind === 'quick'){ blinkDur = .09; }
  else blinkDur = emotion === 'sömnig' ? .6 : rand(.12, .18);
}
function updateBlink(now){
  if (blinkStart < 0 && now > nextBlink){
    const happy = face.visible && /^(glad|kär|neutral|lyssnar)$/.test(emotion);
    if (emotion === 'rädd'){ startBlink('quick'); blinkAgain = 1 + (Math.random() * 2 | 0); }
    else if (happy && Math.random() < .15) startBlink('slow');
    else if (Math.random() < .15) startBlink('half');
    else { startBlink(); blinkAgain = Math.random() < .2 ? 1 : 0; }   // ibland dubbelblink
    nextBlink = now + (emotion === 'rädd' ? rand(700, 1600) : emotion === 'sömnig' ? rand(1500, 3500) : rand(2000, 6000));
  }
  if (blinkStart >= 0){
    const ph = (now - blinkStart) / 1000 / blinkDur;
    if (ph >= 1){
      blinkStart = -1; blink = 0;
      if (blinkAgain > 0){ blinkAgain--; setTimeout(() => startBlink(emotion === 'rädd' ? 'quick' : ''), 90); }
    } else {
      const c = .4 - blinkHold / 2, o = .4 + blinkHold / 2;           // stäng – håll – öppna
      blink = blinkAmp * (ph < c ? ph / c : ph < o ? 1 : 1 - (ph - o) / (1 - o));
    }
  }
}

// ---------- Blick ----------
let g = {x:0,y:0}, gv = {x:0,y:0}, gT = {x:0,y:0}, nextSacc = 0, glanceUntil = 0, nextGlance = 0, pendGaze = null;
let tiltG = {x:0, y:0};   // från telefonens lutning
let jit = {x:0,y:0}, nextJit = 0;
function lookAt(x, y, ms){
  gT = {x:clamp(x,-1,1), y:clamp(y,-1,1)}; glanceUntil = performance.now() + (ms||1200);
}
function updateGaze(now, dt){
  const faceVisible = face.visible;
  if (now > nextJit){ jit = {x:rand(-.03,.03), y:rand(-.025,.025)}; nextJit = now + rand(600,1600); }

  if (faceVisible){
    // titta på personen, men kika bort ibland så det känns naturligt
    if (now > nextGlance){
      if (Math.random() < .12){ glanceUntil = now + rand(350,700); gT = {x:rand(-.9,.9), y:rand(-.5,.4)}; }
      nextGlance = now + rand(4000,9000);
    }
    if (now > glanceUntil){ gT.x = face.x + jit.x; gT.y = face.y + jit.y; }
  } else if (now > nextSacc && now > glanceUntil){
    // låtsas titta runt i rummet
    const amp = emotion === 'sömnig' ? .3 : 1, near = Math.random() < .6;
    const nx = (near ? rand(-.3,.3) : rand(-1,1)) * amp;
    const ny = (near ? rand(-.2,.2) : rand(-.7,.6)) * amp;
    // förberedelse: kisa/blinka lite innan en stor blickrörelse
    if (Math.hypot(nx - gT.x, ny - gT.y) > .6 && Math.random() < .5){
      startBlink(Math.random() < .5 ? 'half' : ''); pendGaze = {x: nx, y: ny, at: now + 110};
    } else gT = {x:nx, y:ny};
    nextSacc = now + rand(700,3500);
  }
  if (pendGaze && now >= pendGaze.at){ gT = {x: pendGaze.x, y: pendGaze.y}; pendGaze = null; }
  const tx = clamp(gT.x + cur.gx + tiltG.x, -1.2, 1.2), ty = clamp(gT.y + cur.gy + tiltG.y, -1.2, 1.2);
  // fjäder: blicken skjuter lite förbi målet och gungar tillbaka – känns levande
  const K = 170, C = 21;
  gv.x += (K * (tx - g.x) - C * gv.x) * dt; gv.y += (K * (ty - g.y) - C * gv.y) * dt;
  g.x += gv.x * dt; g.y += gv.y * dt;
}

// ---------- Kamera & ansiktsföljning (allt sker lokalt i telefonen) ----------
const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite';
const video = document.getElementById('v');
let detector = null, camOn = false, stream = null, lastDet = 0;
let face = {x:0, y:0, size:0, visible:false, lastSeen:0, lostAt:0, count:0};
let faceIdx = 0, nextFaceSwitch = 0;

async function startCamera(){
  status('Startar kamera…');
  if (!navigator.mediaDevices || !window.isSecureContext){
    status('Kameran kräver https'); return false;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:{ideal:320}, height:{ideal:240}}, audio:false});
    video.srcObject = stream; await video.play();
  } catch(e){ status('Ingen kameraåtkomst'); return false; }
  if (!detector){
    try {
      status('Laddar ansiktsigenkänning…');
      const {FaceDetector, FilesetResolver} = await import(MP + '/vision_bundle.mjs');
      const fs = await FilesetResolver.forVisionTasks(MP + '/wasm');
      const opts = d => ({baseOptions:{modelAssetPath:MODEL, delegate:d}, runningMode:'VIDEO', minDetectionConfidence:.5});
      try { detector = await FaceDetector.createFromOptions(fs, opts('GPU')); }
      catch(e){ detector = await FaceDetector.createFromOptions(fs, opts('CPU')); }
    } catch(e){ status('Kunde inte ladda ansiktsigenkänning'); stopCamera(); return false; }
  }
  camOn = true; store.set('cam', true); status('Kameran är på 👀'); updateButtons();
  return true;
}
function stopCamera(){
  camOn = false; face.visible = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; store.set('cam', false); updateButtons();
}
function detect(now){
  if (!camOn || !detector || video.readyState < 2 || now - lastDet < 66) return;
  lastDet = now;
  let res;
  try { res = detector.detectForVideo(video, now); } catch(e){ return; }
  const dets = (res && res.detections) || [];
  if (dets.length){
    // flera barn: titta på dem i tur och ordning, annars på det närmaste ansiktet
    let best = dets[0];
    for (const d of dets) if (d.boundingBox.width > best.boundingBox.width) best = d;
    if (dets.length > 1){
      const sorted = dets.slice().sort((a, b) => a.boundingBox.originX - b.boundingBox.originX);
      if (now > nextFaceSwitch){ faceIdx = Math.random() * sorted.length | 0; nextFaceSwitch = now + rand(2200, 5000); }
      best = sorted[Math.min(faceIdx, sorted.length - 1)];
    }
    face.count = dets.length;
    const b = best.boundingBox, vw = video.videoWidth || 320, vh = video.videoHeight || 240;
    const xn = (b.originX + b.width/2) / vw, yn = (b.originY + b.height/2) / vh;
    const fx = clamp((.5 - xn) * 3.2 * (mirror ? -1 : 1), -1, 1);
    const fy = clamp((yn - .45) * 3.0, -1, 1);
    if (!face.visible) onFaceAppear(now);
    face.x += (fx - face.x) * .5; face.y += (fy - face.y) * .5;
    face.size += (b.width/vw - face.size) * .3;
    face.visible = true; face.lastSeen = now;
  } else if (face.visible && now - face.lastSeen > 700){
    face.visible = false; face.lostAt = now;
  }
}

// ---------- Automatiska reaktioner ----------
let lastActivity = performance.now(), autoSlept = false;
function onFaceAppear(now){
  const away = now - (face.lostAt || 0);
  if (away > INITIATIV.greetAfterMs || firstSeenToday()) pendingArrival = now;   // värt att hälsa ordentligt
  lastActivity = now;
  if (!autoMode || tempActive) return;
  if (autoSlept && baseEmotion === 'sömnig'){ wake(); }
  else if (baseEmotion === 'neutral' && away > 4000){ play([['glad', 1400]]); if (Math.random() < .6) sound('hej', {soft: true, extra: true}); }
}
function wake(){
  autoSlept = false; baseEmotion = 'neutral';
  play([['förvånad', 500], ['glad', 1600]]);
  sound('förvånad', {extra: true}); setTimeout(() => sound('glad', {soft: true, extra: true}), 500);
}
function autoTick(now){
  if (!autoMode || tempActive) return;
  const idleLimit = camOn ? 40000 : 120000;   // somnar om ingen syns / rör den
  if (baseEmotion === 'neutral' && !face.visible && now - lastActivity > idleLimit){
    baseEmotion = 'sömnig'; autoSlept = true; apply('sömnig'); sound('gäsp', {extra: true});
  }
}

// ---------- Rita ----------
function roundRect(c, x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x+r, y); c.arcTo(x+w, y, x+w, y+h, r); c.arcTo(x+w, y+h, x, y+h, r);
  c.arcTo(x, y+h, x, y, r); c.arcTo(x, y, x+w, y, r); c.closePath();
}
function heartPath(c, s){
  c.beginPath();
  c.moveTo(0, s*.45);
  c.bezierCurveTo(-s*.95, -s*.05, -s*.55, -s*.8, 0, -s*.28);
  c.bezierCurveTo(s*.55, -s*.8, s*.95, -s*.05, 0, s*.45);
  c.closePath();
}
const rgb = (c, a=1) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const mixWhite = (c, t) => c.map(v => v + (255 - v) * t);

function drawEye(cx, cy, p, side, bw, bh, sx, sy, t, ex){
  const color = cur.color, inner = -side;               // inre sidan = mot mitten
  const squeeze = ex ? ex.squeeze : 0;                  // petat på ögat
  const ew = bw * p.w * sx * (1 + blink * .08 + squeeze * .12);   // blir lite bredare när det blinkar
  const eh = bh * p.h * sy * (1 - blink * .9) * (1 - squeeze * .8);
  const lidX = ex ? ex.lidAdd : 0;
  const pad = Math.max(bw, bh) * 1.0, size = pad * 2;
  const px = Math.max(2, Math.ceil(size * DPR));
  if (!(size > 1)) return;                              // inget att rita (fönstret har ingen storlek än)
  if (oc.width !== px){ oc.width = px; oc.height = px; }
  octx.setTransform(DPR, 0, 0, DPR, pad*DPR, pad*DPR);
  octx.globalCompositeOperation = 'source-over';
  octx.clearRect(-pad, -pad, size, size);

  const shapeS = p.heart < .5 ? 1 - p.heart*2 : 0;     // ögat krymper…
  const heartS = p.heart > .5 ? (p.heart - .5)*2 : 0;  // …och hjärtat poppar fram

  if (shapeS > .01){
    const w = ew * shapeS, h = Math.max(1, eh * shapeS), top = -h/2;
    const grad = octx.createLinearGradient(0, top, 0, h/2);
    grad.addColorStop(0, rgb(mixWhite(color, .35))); grad.addColorStop(1, rgb(color));
    octx.fillStyle = grad;
    roundRect(octx, -w/2, top, w, h, Math.min(w, h) * p.r); octx.fill();

    octx.globalCompositeOperation = 'destination-out';
    octx.fillStyle = '#000';
    // övre ögonlock med lutning
    const lid = Math.min(1, p.lid + (p.lid < .6 ? lidX : 0));
    const yMid = top + lid*h*1.06, dy = p.tilt * h * .4;     // *1.06 = inga glipor när ögat är helt stängt
    const yAt = x => yMid + dy * (x * inner) / (w/2);        // ögonlockets kant vid x
    if (lid > .005 || Math.abs(p.tilt) > .005){
      octx.beginPath();
      octx.moveTo(-w, top - h); octx.lineTo(w, top - h);
      octx.lineTo(w, yAt(w)); octx.lineTo(-w, yAt(-w)); octx.closePath(); octx.fill();
    }
    if (p.bot > .005) octx.fillRect(-w, h/2 - p.bot*h, w*2, h);
    // glad båge (^ ^)
    if (p.smile > .01){
      const ry = h * .55, rx = w * .8, cyS = h/2 + ry - p.smile * h * .85;
      octx.beginPath(); octx.ellipse(0, cyS, rx, ry, 0, 0, Math.PI*2); octx.fill();
    }
    // glans – flyttar sig lite mot blicken (djupkänsla) och tindrar när han är glad
    octx.globalCompositeOperation = 'source-atop';
    const m = Math.min(w, h);
    const hx = -g.x * w * .06, hy = -g.y * h * .05;
    const tw = /^(glad|kär|förvånad|stolt|sjunger)$/.test(emotion) ? 1 + Math.sin(t * 3.1 + side) * .1 : 1;
    // mjukt reflexljus längst ner – som glas
    const rim = octx.createRadialGradient(w*.1, h*.62, 0, w*.1, h*.62, w*.7);
    rim.addColorStop(0, 'rgba(255,255,255,.16)'); rim.addColorStop(1, 'rgba(255,255,255,0)');
    octx.fillStyle = rim; octx.fillRect(-w, -h, w*2, h*2);
    // glansen glider ner under ögonlocket så att den alltid syns
    const r1 = m*.13*tw, r2 = m*.055*tw;
    const gx1 = -w*.2 + hx, gx2 = -w*.04 + hx*1.4;
    let gy1 = -h*.2 + hy, gy2 = -h*.32 + hy*1.4;
    const lidLow = Math.max(yAt(gx1 - r1), yAt(gx1 + r1));
    const push = Math.max(0, lidLow + r1 * 1.15 - gy1);
    gy1 = Math.min(gy1 + push, h*.5 - r1 * 1.2 - p.smile * h * .5);
    gy2 = Math.min(gy2 + push, gy1 - r1 * .2);
    const showSmall = gy2 - r2 > Math.max(yAt(gx2 - r2), yAt(gx2 + r2));
    octx.fillStyle = 'rgba(255,255,255,.9)';
    octx.beginPath(); octx.arc(gx1, gy1, r1, 0, Math.PI*2); octx.fill();
    if (showSmall){ octx.fillStyle = 'rgba(255,255,255,.7)'; octx.beginPath(); octx.arc(gx2, gy2, r2, 0, Math.PI*2); octx.fill(); }
  }
  if (heartS > .01){
    octx.globalCompositeOperation = 'source-over';
    const beat = Math.pow(Math.max(0, Math.sin(t*5)), 8) * .14;
    const s = Math.min(bw, bh) * 1.2 * heartS * (1 + beat) * sx;
    octx.save(); octx.scale(1, (1 - blink*.9));
    const grad = octx.createLinearGradient(0, -s*.5, 0, s*.5);
    grad.addColorStop(0, rgb(mixWhite(color, .35))); grad.addColorStop(1, rgb(color));
    octx.fillStyle = grad; heartPath(octx, s); octx.fill();
    octx.globalCompositeOperation = 'source-atop';
    octx.fillStyle = 'rgba(255,255,255,.85)';
    octx.beginPath(); octx.arc(-s*.28, -s*.3, s*.09, 0, Math.PI*2); octx.fill();
    octx.restore();
  }

  ctx.save();
  ctx.shadowColor = rgb(color, .55);
  ctx.shadowBlur = Math.min(40, bw * .18) * DPR * (ex ? ex.glow : 1);
  ctx.drawImage(oc, cx - pad, cy + p.y*bh - pad, size, size);

  // ögonbryn – syns bara när känslan behöver dem
  if (p.bA > .02 && p.heart < .5){
    const len = bw * p.w * sx * .78, th = bw * .085;
    const by = cy + p.y*bh - bh * p.h * sy * .5 - bh * (.15 + p.bY) * (p.h > 1.1 ? .8 : 1) + blink * bh * .03;
    const tiltY = p.bT * bh * .13;                       // inre änden ner = arg, upp = ledsen
    const xIn = cx + inner * len / 2, xOut = cx - inner * len / 2;
    ctx.globalAlpha = Math.min(1, p.bA);
    ctx.strokeStyle = rgb(mixWhite(color, .25)); ctx.lineWidth = th; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(xOut, by - tiltY * .3);
    ctx.quadraticCurveTo(cx, by - p.bC * bh * .14 + tiltY * .2, xIn, by + tiltY);
    ctx.stroke();
  }
  ctx.restore();
}

function render(t, now){
  if (!(W > 2 && H > 2)){ resize(); if (!(W > 2 && H > 2)) return; }   // fönstret har ingen storlek än
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);

  const bw = Math.min(W * .25, H * .42) * (1 - lay * .56) * (1 - costumeAmt * .5), bh = bw * 1.15;
  const breathe = 1 + Math.sin(t * 1.7) * .012;
  const age = (now - changeAt) / 1000;
  const sq = Math.exp(-age * 6) * Math.sin(age * 20) * .1;          // studs vid nytt uttryck
  const prox = face.visible ? 1 + clamp((face.size - .3) * .4, 0, .15) : 1; // nära = större ögon
  const ll = convo && convo.phase === 'speech' ? clamp(convo.level * 8, 0, 1) : 0;   // ögonen "hör" din röst
  if (convo) micBtn.style.transform = `translateX(-50%) scale(${(1.05 + ll * .35).toFixed(3)})`;
  const tv = voiceLevel >= 0 ? voiceLevel : .5 + .5 * (Math.sin(t*13) * .6 + Math.sin(t*7.7) * .4);
  const T = Math.max(cur.talk, talkAmt);
  const talkH = 1 - T * .14 * tv;
  const sx = (1 + sq) * breathe * prox * (1 + ll * .07), sy = (1 - sq) * breathe * prox * talkH * (1 + ll * .07);
  const nodP = clamp((now - nodAt) / 380, 0, 1);
  const bounceY = Math.sin(nodP * Math.PI) * bh * .07 + Math.sin(t * 3.2) * cur.bounce * bh * .06 - T * tv * bh * .03
                + Math.abs(Math.sin(t * 13)) * cur.jiggle * bh * -.05;
  const ox = g.x * bw * .55 + Math.sin(t * 38) * cur.shiver * bw * .025 + Math.cos(t * 6) * cur.spin * bw * .5;
  const oy = g.y * bh * .4 + Math.sin(t * 6) * cur.spin * bh * .4;
  const gap = bw * .97;

  const fcx = W/2, fcy = H/2 - lay * H * .33 + bounceY - costumeAmt * H * .01;
  if (cur.bg > .01){   // superkänsla: hela skärmen färgas och pulserar
    const pulse = .75 + .25 * Math.sin(t * (emotion === 'rasande' ? 9 : 2.5));
    const bgG = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * .75);
    bgG.addColorStop(0, rgb(cur.color, .42 * cur.bg * pulse)); bgG.addColorStop(1, rgb(cur.color, .12 * cur.bg));
    ctx.fillStyle = bgG; ctx.fillRect(0, 0, W, H);
  }
  // svagt sken bakom ögonen i känslans färg – andas lugnt
  const amb = ctx.createRadialGradient(fcx + ox * .5, fcy + oy * .5, 0, fcx + ox * .5, fcy + oy * .5, bw * 2.8);
  amb.addColorStop(0, rgb(cur.color, .085 * breathe * (1 - cur.L.lid * .6))); amb.addColorStop(1, rgb(cur.color, 0));
  ctx.fillStyle = amb; ctx.fillRect(0, 0, W, H);
  // var ögonen är (för att känna av petningar)
  eyeBox.L = {x: fcx - gap + ox, y: fcy + oy, rx: bw * .6, ry: bh * .6};
  eyeBox.R = {x: fcx + gap + ox, y: fcy + oy, rx: bw * .6, ry: bh * .6};
  const sqz = s => { const d = (now - poke[s]) / 550; return d >= 0 && d < 1 ? Math.sin(Math.min(1, d * 2.2) * Math.PI / 2) * (1 - Math.max(0, d - .5) * 2) : 0; };
  const glow = 1 + Math.sin(t * 1.7) * .08 + T * tv * .25;
  ctx.save();
  ctx.translate(fcx, fcy);
  ctx.rotate((cur.roll + g.x * 3 + Math.sin(t * 2.2) * cur.sway * 8) * Math.PI / 180);   // lutar huvudet åt det håll den tittar
  // ögat åt det håll den tittar blir lite större (perspektiv)
  const pv = .14;
  if (costumeAmt > .01) withCostume(() => drawFarfarBak(t, gap, ox, oy, bw, bh));
  const lidAdd = squint + drowse;
  drawEye(-gap + ox, oy, cur.L, -1, bw, bh, sx * (1 - g.x*pv), sy * (1 - g.x*pv*.6), t, {squeeze: sqz('L'), lidAdd, glow});
  drawEye( gap + ox, oy, cur.R,  1, bw, bh, sx * (1 + g.x*pv), sy * (1 + g.x*pv*.6), t, {squeeze: sqz('R'), lidAdd, glow});

  if (cur.blush > .02){
    for (const s of [-1, 1]){
      const bx = s*gap + ox*.6, by = bh*.66 + oy*.5, r = bw*.33;
      const gr = ctx.createRadialGradient(bx, by, 0, bx, by, r);
      gr.addColorStop(0, `rgba(255,110,150,${.5*cur.blush})`); gr.addColorStop(1, 'rgba(255,110,150,0)');
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.ellipse(bx, by, r, r*.6, 0, 0, Math.PI*2); ctx.fill();
    }
  }
  if (costumeAmt > .01) withCostume(() => drawFarfar(t, gap, ox, oy, bw, bh));
  emitParticles(now, gap, ox, oy, bw, bh);
  drawParticles(bw);
  ctx.restore();
}

// ============================================================
//  HEMLIGT LÄGE: FARFAR 👴🇹🇳
//  "Frank-Y, kan du prata som farfar?" → chechia, skägg och tunisisk röst.
//  Han förstår svenska men svarar på tunisiska. "Prata svenska igen" → tillbaka.
// ============================================================
let costume = null, costumeAmt = 0;
function withCostume(fn){
  ctx.save(); ctx.globalAlpha = Math.min(1, costumeAmt * 1.2);
  const sc = .85 + .15 * costumeAmt; ctx.scale(sc, sc);
  fn(); ctx.restore();
}
function costumeBurst(){
  // glittervirvel runt ansiktet
  const bw = Math.min(W * .25, H * .42);
  for (let i = 0; i < 26; i++){
    const an = i / 26 * Math.PI * 2, r = bw * rand(.9, 1.9);
    parts.push({k:'glitter', x: Math.cos(an) * r, y: Math.sin(an) * r * .7, vx: Math.cos(an) * bw * .6, vy: Math.sin(an) * bw * .4, life: rand(.5, 1.1), s: rand(.6, 1.3)});
  }
  [0, .09, .18, .3].forEach((d, i) => chirp([[0, 700 * Math.pow(1.26, i)], [.08, 760 * Math.pow(1.26, i)]], {delay: d, vol: .1}));
}
function setCostume(name){
  if (costume === name) return;
  costume = name; costumeBurst(); changeAt = performance.now();
}
// Farfar-läge: tunisisk chechia, yviga bryn, fylligt gråvitt skägg och en mun som pratar
let feltDots = null;
function drawFarfarBak(t, gap, ox, oy, bw, bh){
  ctx.save();
  const hw = gap + bw * .72;                  // halva mössans bredd
  const base = oy - bh * .9, top = oy - bh * 1.7;
  // --- chechia: rund filtmössa ---
  const capPath = () => {
    ctx.beginPath();
    ctx.moveTo(ox - hw, base);
    ctx.bezierCurveTo(ox - hw * 1.02, top + bh * .25, ox - hw * .7, top, ox, top);
    ctx.bezierCurveTo(ox + hw * .7, top, ox + hw * 1.02, top + bh * .25, ox + hw, base);
    ctx.bezierCurveTo(ox + hw * .5, base + bh * .16, ox - hw * .5, base + bh * .16, ox - hw, base);
    ctx.closePath();
  };
  const g1 = ctx.createRadialGradient(ox - hw * .3, top + bh * .25, bw * .1, ox, base, hw * 1.3);
  g1.addColorStop(0, '#c0262c'); g1.addColorStop(.55, '#94141b'); g1.addColorStop(1, '#4a070b');
  ctx.save(); ctx.shadowColor = 'rgba(200,40,40,.35)'; ctx.shadowBlur = bw * .2; ctx.fillStyle = g1; capPath(); ctx.fill(); ctx.restore();
  // filtstruktur
  ctx.save(); capPath(); ctx.clip();
  if (!feltDots){ feltDots = []; for (let i = 0; i < 160; i++) feltDots.push([Math.random() * 2 - 1, Math.random(), Math.random()]); }
  for (const [fx, fy, fa] of feltDots){
    ctx.fillStyle = fa > .5 ? 'rgba(255,120,110,.10)' : 'rgba(60,0,0,.12)';
    ctx.fillRect(ox + fx * hw, top + fy * (base - top + bh * .15), bw * .02, bw * .02);
  }
  // glansig rand nertill
  ctx.strokeStyle = 'rgba(90,5,10,.55)'; ctx.lineWidth = bh * .07;
  ctx.beginPath(); ctx.moveTo(ox - hw, base - bh * .03); ctx.bezierCurveTo(ox - hw * .5, base + bh * .12, ox + hw * .5, base + bh * .12, ox + hw, base - bh * .03); ctx.stroke();
  // ljusreflex
  const hl = ctx.createLinearGradient(ox - hw, top, ox - hw * .2, base);
  hl.addColorStop(0, 'rgba(255,200,190,.28)'); hl.addColorStop(1, 'rgba(255,200,190,0)');
  ctx.fillStyle = hl; ctx.fillRect(ox - hw, top, hw * .9, base - top);
  ctx.restore();
  // --- tofs av svarta trådar som svänger ---
  const sw = Math.sin(t * 2.1) * bw * .07, tx = ox, ty = top + bh * .01;
  ctx.strokeStyle = '#141212'; ctx.lineCap = 'round';
  ctx.fillStyle = '#1b1818'; ctx.beginPath(); ctx.ellipse(tx, ty, bw * .07, bh * .035, 0, 0, Math.PI * 2); ctx.fill();
  for (let i = 0; i < 11; i++){
    const f = i / 10, len = bh * (.62 + Math.sin(i * 1.7) * .06);
    ctx.lineWidth = bw * .028;
    ctx.beginPath(); ctx.moveTo(tx, ty);
    ctx.quadraticCurveTo(tx + hw * (.5 + f * .15) + sw * .5, ty - bh * .04, tx + hw * (.82 + f * .14) + sw, ty + len * .9);
    ctx.stroke();
  }
  // --- polisonger som binder ihop mössa och skägg ---
  ctx.fillStyle = '#5c544d';
  for (const s of [-1, 1]){
    ctx.beginPath();
    ctx.moveTo(ox + s * hw * .97, base - bh * .02);
    ctx.quadraticCurveTo(ox + s * (gap + bw * .92), oy - bh * .2, ox + s * (gap + bw * .82), oy + bh * .45);
    ctx.lineTo(ox + s * (gap + bw * .62), oy + bh * .4);
    ctx.quadraticCurveTo(ox + s * (gap + bw * .74), oy - bh * .2, ox + s * hw * .86, base + bh * .04);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function drawFarfar(t, gap, ox, oy, bw, bh){
  ctx.save();
  const talk = Math.max(cur.talk, talkAmt), tvv = voiceLevel >= 0 ? voiceLevel : .5 + .5 * Math.sin(t * 12);
  // yviga gråvita ögonbryn som lyfts lite när han pratar
  for (const s of [-1, 1]){
    const by = oy - bh * .66 - talk * tvv * bh * .05 + Math.sin(t * 2.2 + s) * bh * .012;
    for (let i = 0; i < 10; i++){
      const f = i / 9, x = s * gap + ox + (f - .5) * bw * 1.0 * -s;
      ctx.fillStyle = i % 3 === 0 ? 'rgba(200,195,186,.97)' : 'rgba(92,84,77,.98)';
      ctx.beginPath(); ctx.ellipse(x, by - Math.sin(f * Math.PI) * bh * .08 + (f > .85 ? bh * .05 : 0), bw * .11, bh * .06, s * (f - .5) * .9 + .2, 0, Math.PI * 2); ctx.fill();
    }
  }
  // fylligt skägg
  const sideX = gap + bw * .82, cheek = oy + bh * .42, chin = oy + bh * 1.42;
  const beard = () => {
    ctx.beginPath();
    ctx.moveTo(ox - sideX, cheek);
    ctx.bezierCurveTo(ox - sideX * 1.04, chin - bh * .35, ox - bw * .75, chin, ox, chin);
    ctx.bezierCurveTo(ox + bw * .75, chin, ox + sideX * 1.04, chin - bh * .35, ox + sideX, cheek);
    ctx.bezierCurveTo(ox + sideX * .7, oy + bh * .62, ox + bw * .55, oy + bh * .8, ox, oy + bh * .8);
    ctx.bezierCurveTo(ox - bw * .55, oy + bh * .8, ox - sideX * .7, oy + bh * .62, ox - sideX, cheek);
    ctx.closePath();
  };
  const bg = ctx.createLinearGradient(0, cheek, 0, chin);
  bg.addColorStop(0, '#6b625a'); bg.addColorStop(.6, '#4f4842'); bg.addColorStop(1, '#3a3430');
  ctx.save(); ctx.shadowColor = 'rgba(255,215,170,.28)'; ctx.shadowBlur = bw * .25; ctx.fillStyle = bg; beard(); ctx.fill(); ctx.restore();
  // skäggstrån
  ctx.save(); beard(); ctx.clip();
  ctx.lineWidth = bw * .02;
  for (let i = 0; i < 34; i++){
    ctx.strokeStyle = i % 3 ? 'rgba(205,198,188,.45)' : 'rgba(30,26,24,.4)';   // grå strån
    const f = i / 33, x = ox + (f - .5) * sideX * 1.9, y0 = oy + bh * (.85 + Math.abs(f - .5) * -.3);
    ctx.beginPath(); ctx.moveTo(x, y0);
    ctx.quadraticCurveTo(x + Math.sin(i) * bw * .06, y0 + bh * .3, x + (f - .5) * bw * .25, y0 + bh * .6); ctx.stroke();
  }
  ctx.restore();
  // munnen – öppnar sig när han pratar
  const open = .06 + talk * tvv * .16;
  const my0 = oy + bh * .9;
  ctx.fillStyle = '#4a1517';
  ctx.beginPath(); ctx.moveTo(ox - bw * .42, my0);
  ctx.quadraticCurveTo(ox, my0 + bh * (open + .22), ox + bw * .42, my0);
  ctx.quadraticCurveTo(ox, my0 + bh * .04, ox - bw * .42, my0); ctx.fill();
  ctx.fillStyle = '#f5f0e6';
  ctx.beginPath(); ctx.moveTo(ox - bw * .36, my0 + bh * .02); ctx.quadraticCurveTo(ox, my0 + bh * .1, ox + bw * .36, my0 + bh * .02);
  ctx.quadraticCurveTo(ox, my0 + bh * .06, ox - bw * .36, my0 + bh * .02); ctx.fill();
  // tunga
  ctx.fillStyle = '#c65a5e';
  ctx.beginPath(); ctx.ellipse(ox, my0 + bh * (open + .12), bw * .16, bh * (.03 + open * .25), 0, 0, Math.PI); ctx.fill();
  // svängd mustasch som vickar

  for (const p of parts){
    p.life -= dt; p.age = (p.age || 0) + dt;

let motionOn = false, motionAttached = false, gravS = null, gSign = 0, prevA = null, shakeHits = [], lastShake = 0, lastLift = 0, liftSince = 0;

function onMotion(e){

async function callBrain(body, path = '', binary = false){
  let r, text;
  try {
    r = await fetch(serverUrl + path, {
      method: 'POST',
      headers: {'Content-Type': binary ? 'audio/wav' : 'application/json', 'X-Robot-Password': password},

let ac = null;
function audio(){
  if (!ac){ const AC = window.AudioContext || window.webkitAudioContext; if (AC) ac = new AC(); }

}

function tone(f1, f2, dur, delay = 0, type = 'sine', vol = .18){

  gn.gain.setValueAtTime(.0001, t0);
  gn.gain.exponentialRampToValueAtTime(vol, t0 + .02);
  gn.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(gn).connect(a.destination);
  o.start(t0); o.stop(t0 + dur + .05);

  for (let i = 1; i < pts.length; i++) osc.frequency.exponentialRampToValueAtTime(Math.max(40, pts[i][1] * pm), t0 + pts[i][0]);
  let lfo = null;
  if (o.vib){
    lfo = a.createOscillator(); lfo.frequency.value = o.vibHz || 6;
    const d = a.createGain(); d.gain.value = o.vib * pts[0][1] * pm; lfo.connect(d).connect(osc.frequency);
  }
  const vol = (o.vol || .14) * vm * (o.formant ? 2.2 : 1);
  const g = a.createGain();
  g.gain.setValueAtTime(.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + Math.min(.025, end * .3));
  g.gain.setValueAtTime(vol, t0 + end * .6);

let svVoice = null;
function pickVoice(){
  const sv = speechSynthesis.getVoices().filter(v => /^sv/i.test(v.lang));
  const local = sv.filter(v => v.localService !== false);
  svVoice = local.find(v => /alva|klara/i.test(v.name)) || local[0] || null;

const clean = s => String(s || '').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, '').replace(/[*_#`]/g, '').trim();

let voiceFailed = false;
function speak(text){
  return new Promise(res => {
    text = clean(text);
    if (!text || !/[\p{L}\p{N}]/u.test(text) || !('speechSynthesis' in window)){ res(); return; }   // bara skiljetecken → säg inget
    const arabic = /[\u0600-\u06FF]/.test(text);
    const arVoice = arabic ? speechSynthesis.getVoices().find(v => /^ar/i.test(v.lang)) : null;
    if (arabic && !arVoice){ status('Farfars röst svarar inte – kolla att hjärnan är version 13', 6000); res(); return; }
    let finished = false, started = false;
    const done = () => { if (finished) return; finished = true; speaking = false; res(); };
    const go = () => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = arabic ? (arVoice.lang || 'ar') : 'sv-SE';
      if (arabic) u.voice = arVoice;
      else if (svVoice && !voiceFailed) u.voice = svVoice;
      u.pitch = VOICE.pitch; u.rate = VOICE.rate; u.volume = 1;
      u.onstart = () => { started = true; speaking = true; };
      u.onend = done;
      u.onerror = e => {
        // Prova igen med telefonens standardröst om den valda inte fungerar
        if (!started && !voiceFailed && svVoice){ voiceFailed = true; setTimeout(go, 200); return; }
        if (e.error !== 'interrupted' && e.error !== 'canceled') status('Röstfel: ' + (e.error || 'okänt'), 8000);
        done();
      };
      speaking = true;
      speechSynthesis.speak(u);
      setTimeout(() => { if (!started && !finished) speechSynthesis.resume(); }, 1200);
      setTimeout(() => { if (!started && !finished) status('Rösten startade inte – kolla ljudlöst-knappen och volymen', 8000); }, 4000);
    };
    // Safari tappar ibland repliken om man avbryter och pratar direkt efter – vänta lite
    if (speechSynthesis.speaking || speechSynthesis.pending){ speechSynthesis.cancel(); setTimeout(go, 300); }
    else go();
    setTimeout(done, 5000 + text.length * 110);   // reserv om iPhone glömmer säga "klar"
  });
}

// ---------- Robotröst: spela Azure-ljudet med robotklang ----------
// Ändra fritt: ring = metallisk robotton, metal = plåtigt eko, speed = tempo/tonhöjd
// rost = sträv, lite trasig högtalare (0 = ingen, .6 = mycket) · knaster = små sprak i rösten
const ROBOT_FX = { ring: .35, ringHz: 48, metal: .3, speed: 1.06, rost: .35, knaster: .25 };
const rostCurve = (() => { const n = 1024, c = new Float32Array(n), k = 18;
  for (let i = 0; i < n; i++){ const x = i / (n - 1) * 2 - 1; c[i] = (1 + k) * x / (1 + k * Math.abs(x)); } return c; })();

let voiceLevel = -1, analyser = null, levelBuf = null;
function updateVoiceLevel(){
  if (!analyser || !speaking){ voiceLevel = -1; return; }
  analyser.getByteTimeDomainData(levelBuf);
  let sum = 0; for (let i = 0; i < levelBuf.length; i++){ const v = (levelBuf[i] - 128) / 128; sum += v*v; }
  const rms = Math.sqrt(sum / levelBuf.length);
  const target = clamp(rms * 4, 0, 1);
  voiceLevel = voiceLevel < 0 ? target : voiceLevel + (target - voiceLevel) * .5;
}
let currentSrc = null, interrupted = false;
async function playRobotVoice(arrayBuf){
  const a = audio(); if (!a) throw new Error('inget ljud');
  const audioBuf = await new Promise((ok, bad) => a.decodeAudioData(arrayBuf.slice(0), ok, bad));
  if (interrupted) return;
  return new Promise(res => {
    const src = a.createBufferSource(); src.buffer = audioBuf; src.playbackRate.value = ROBOT_FX.speed;
    const extraStops = [];
    const out = a.createGain(); out.gain.value = 1.1;
    const comp = a.createDynamicsCompressor();
    const hp = a.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 140;
    // ren röst
    const dry = a.createGain(); dry.gain.value = 1 - ROBOT_FX.ring * .5;
    src.connect(dry).connect(hp);
    // ringmodulator = klassisk robotklang
    const ring = a.createGain(); ring.gain.value = 0;
    const osc = a.createOscillator(); osc.frequency.value = ROBOT_FX.ringHz;
    const oscAmt = a.createGain(); oscAmt.gain.value = ROBOT_FX.ring; osc.connect(oscAmt).connect(ring.gain);
    src.connect(ring).connect(hp);
    // kort eko med återkoppling = plåtig "burk"-ton
    const dl = a.createDelay(); dl.delayTime.value = .007;
    const fb = a.createGain(); fb.gain.value = .45;
    const wet = a.createGain(); wet.gain.value = ROBOT_FX.metal;
    src.connect(dl); dl.connect(fb).connect(dl); dl.connect(wet).connect(hp);
    // rost: sträv distorsion i mellanregistret, parallellt med rösten
    if (ROBOT_FX.rost > 0){
      const sh = a.createWaveShaper(); sh.curve = rostCurve; sh.oversample = '2x';
      const pre = a.createGain(); pre.gain.value = 2.5;
      const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1900; bp.Q.value = .9;
      const rg = a.createGain(); rg.gain.value = ROBOT_FX.rost * .35;
      src.connect(pre).connect(sh).connect(bp).connect(rg).connect(hp);
    }
    // knaster: små sprak som bara hörs när han pratar (följer röstens styrka)
    if (ROBOT_FX.knaster > 0){
      if (!crackleBuf){
        crackleBuf = a.createBuffer(1, a.sampleRate, a.sampleRate); const d = crackleBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() < .004 ? (Math.random() * 2 - 1) : (Math.random() * 2 - 1) * .02;
      }
      const nz = a.createBufferSource(); nz.buffer = crackleBuf; nz.loop = true;
      const vca = a.createGain(); vca.gain.value = 0;
      const env = a.createWaveShaper(); env.curve = absCurve;                 // röstens styrka…
      const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 25;
      const amt = a.createGain(); amt.gain.value = ROBOT_FX.knaster * 1.6;
      src.connect(env).connect(lp).connect(amt).connect(vca.gain);              // …styr hur mycket det knastrar
      nz.connect(vca).connect(hp); nz.start(); extraStops.push(nz);
    }
    hp.connect(comp).connect(out).connect(a.destination);
    analyser = a.createAnalyser(); analyser.fftSize = 512; levelBuf = new Uint8Array(analyser.fftSize);
    out.connect(analyser);
    let fin = false;
    const done = () => { if (fin) return; fin = true; speaking = false; currentSrc = null; try { osc.stop(); } catch(_){} extraStops.forEach(n => { try { n.stop(); } catch(_){} }); res(); };
    src.onended = done; currentSrc = src;
    speaking = true; osc.start(); src.start();
    setTimeout(done, audioBuf.duration / ROBOT_FX.speed * 1000 + 1500);

}

// ============================================================
//  SAMTALSLÄGE
//  Tryck på 🎤 en gång → Frank-Y lyssnar automatiskt mellan svaren.
//  Pratar man när han pratar tystnar han. Efter en stunds tystnad,
//  eller "hej då", avslutas samtalet och mikrofonen stängs av.
// ============================================================
const CONVO = {
  silenceMs: 1100,   // så lång paus = du har pratat klart
  endAfterMs: 22000, // så lång tystnad = samtalet är slut
  bargeMs: 350,      // så länge man måste prata för att avbryta honom
  maxSpeechMs: 15000 // längsta inspelning åt gången

let convo = null;
let bargeOn = store.get('barge', true);
const HEJDA = /(hej ?då|hejdå|god ?natt|vi ses|ha det bra|sov gott)/i;   // (\b fungerar inte med å/ä/ö)
function rmsOf(d){ let s = 0; for (let i = 0; i < d.length; i++) s += d[i]*d[i]; return Math.sqrt(s / d.length); }

async function startConvo(){
  const a = audio();
  const stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true, autoGainControl: true}});
  const src = a.createMediaStreamSource(stream);
  const proc = a.createScriptProcessor(4096, 1, 1);
  const mute = a.createGain(); mute.gain.value = 0;
  src.connect(proc); proc.connect(mute).connect(a.destination);
  const now = performance.now();
  const c = convo = {stream, src, proc, mute, rate: a.sampleRate, t0: now, noise: 0, n: 0, level: 0,
                     phase: 'listen', chunks: [], pre: [], lastVoice: 0, voiceStart: 0, lastActive: now, bargeSince: 0,
                     preMax: Math.ceil(.3 * a.sampleRate / 4096)};
  proc.onaudioprocess = e => { if (convo === c) onMic(c, new Float32Array(e.inputBuffer.getChannelData(0))); };
}

function onMic(c, d){
  const rms = rmsOf(d), now = performance.now();
  c.level = rms;
  c.pre.push(d); while (c.pre.length > c.preMax) c.pre.shift();      // lite ljud från strax innan man börjar prata
  if (now - c.t0 < 400){ c.noise = (c.noise * c.n + rms) / (++c.n); return; }   // mät bakgrundsljud
  if (c.phase === 'listen' && rms < c.noise * 2) c.noise = c.noise * .98 + rms * .02; // följ bakgrunden långsamt
  const thr = Math.max(.012, c.noise * 2.5);

  if (c.phase === 'listen'){
    if (rms > Math.max(c.noise * 14, .22) && now - (c.lastStartle || 0) > 6000 && !tempActive){   // plötsligt högt ljud
      c.lastStartle = now; play([['förvånad', 900]]); changeAt = now; sound('oj', {extra: true});
    }
    if (rms > thr){ beginSpeech(c, now); }
    else if (now - c.lastActive > CONVO.endAfterMs) endConvo(true);
  } else if (c.phase === 'speech'){
    c.chunks.push(d);
    if (rms > thr){ c.lastVoice = now; c.peak = Math.max(c.peak || 0, rms); c.bcDone = false; }
    // Aktiv lyssnare: ett tyst "mm" eller "oj" och en liten nick i korta pauser
    else if (!c.bcDone && now - c.lastVoice > 300 && now - c.lastVoice < 800 && c.lastVoice - c.voiceStart > 1500 && now - (c.lastBack || 0) > 3500){
      c.bcDone = true;
      if (smaljud && Math.random() < .45){
        c.lastBack = now; nodAt = now;
        sound((c.peak || 0) > Math.max(.08, thr * 5) ? 'oj' : 'mm', {quiet: true});
      }
    }
    if (now - c.lastVoice > CONVO.silenceMs || now - c.voiceStart > CONVO.maxSpeechMs){
      const chunks = c.chunks; c.chunks = [];
      if (c.lastVoice - c.voiceStart < 250){ c.phase = 'listen'; micBtn.classList.remove('on'); return; }  // bara ett ljud, inget prat
      c.phase = 'wait'; micBtn.classList.remove('on');
      hearThenThink(toWav16k(chunks, c.rate));
    }
  } else if (c.phase === 'talk' && bargeOn && !song){
    // Avbryt: någon pratar tydligt medan Frank-Y pratar
    if (rms > Math.max(c.noise * 5, .045)){
      if (!c.bargeSince) c.bargeSince = now;
      if (now - c.bargeSince > CONVO.bargeMs){ c.bargeSince = 0; stopTalking(); beginSpeech(c, now); }
    } else c.bargeSince = 0;
  }

}

}

function toWav16k(chunks, rate){
  let len = 0; for (const c of chunks) len += c.length;
  const all = new Float32Array(len); let o = 0; for (const c of chunks){ all.set(c, o); o += c.length; }
  const ratio = rate / 16000, outLen = Math.floor(len / ratio);
  const buf = new ArrayBuffer(44 + outLen * 2), v = new DataView(buf);
  const w = (p, s) => { for (let i = 0; i < s.length; i++) v.setUint8(p + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + outLen * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 16000, true); v.setUint32(28, 32000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, outLen * 2, true);
  for (let i = 0; i < outLen; i++){
    const a0 = Math.floor(i * ratio), a1 = Math.min(len, Math.floor((i + 1) * ratio));
    let s = 0; for (let j = a0; j < a1; j++) s += all[j]; s /= Math.max(1, a1 - a0);
    v.setInt16(44 + i * 2, clamp(s, -1, 1) * 0x7fff, true);
  }
  return buf;
}

function listenBrowser(){
  if (busy || listening) return;
  if (!SR){ status('Taligenkänning saknas här – skriv istället'); askText(); return; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  const rec = new SR(); activeRec = rec;
  rec.lang = 'sv-SE'; rec.interimResults = false; rec.maxAlternatives = 1; rec.continuous = false;
  let got = false;
  let heard = '';
  rec.onresult = e => { got = true; heard = e.results[0][0].transcript; try { rec.stop(); } catch(_){} };
  rec.onerror = e => {
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') status('Mikrofonen är blockerad – tillåt den under Inställningar → Safari → Mikrofon', 9000);
    else if (e.error === 'no-speech') status('Jag hörde inget – prova igen', 4000);
    else if (e.error !== 'aborted') status('Mikrofonfel: ' + e.error, 6000);
  };
  // Sluta lyssna automatiskt efter 10 sekunder
  const maxTimer = setTimeout(() => { try { rec.abort(); } catch(_){} }, 10000);
  rec.onend = () => {
    clearTimeout(maxTimer);
    try { rec.abort(); } catch(_){}          // släpp mikrofonen helt
    activeRec = null;
    listening = false; micBtn.classList.remove('on');
    // Vänta tills iPhone släppt mikrofonen helt – annars blir rösten tyst

    if (!busy){ sound('klar'); setEmotion('neutral'); }
  };
  listening = true; lastActivity = performance.now();
  micBtn.classList.add('on'); sound('lyssnar'); setEmotion('lyssnar');
  try { rec.start(); }
  catch(e){ listening = false; micBtn.classList.remove('on'); status('Mikrofonen startade inte: ' + e.message, 6000); }
}

// ============================================================
//  INITIATIV – Frank-Y börjar prata själv ibland
// ============================================================
const INITIATIV = {
  gapMs: 15 * 60000,       // högst en gång var 15:e minut
  arrivalGapMs: 5 * 60000, // hälsning när någon kommer: högst var 5:e minut
  greetAfterMs: 10 * 60000,// borta så här länge = hälsa när personen kommer tillbaka
  quietMs: 3 * 60000,      // så här länge tyst med någon i närheten innan han säger något
  tystFran: '19:30',       // tysta tider – då tar han aldrig initiativ
  tystTill: '07:00',
};
let initiativOn = store.get('init', true);
let lastInitiative = 0, pendingArrival = 0, lastInitCheck = 0;
function isQuietHours(){
  const d = new Date(), m = d.getHours() * 60 + d.getMinutes();
  const p = s => { const [a, b] = s.split(':').map(Number); return a * 60 + b; };
  const f = p(INITIATIV.tystFran), t = p(INITIATIV.tystTill);
  return f > t ? (m >= f || m < t) : (m >= f && m < t);
}
function todayKey(){ const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function firstSeenToday(){ return store.get('lastday', '') !== todayKey(); }
function initiativTick(now){
  if (now - lastInitCheck < 1000) return;
  lastInitCheck = now;
  if (pendingArrival && now - pendingArrival > 60000) pendingArrival = 0;          // för gammal hälsning
  if (!initiativOn || !camOn || !face.visible) return;
  if (busy || talking || listening || convo || tempActive || document.hidden) return;
  if (!ac || ac.state !== 'running') return;                                       // iPhone: någon måste ha rört skärmen först
  if (baseEmotion === 'blunda' || panel.classList.contains('open') || sheet.classList.contains('open')) return;
  if (!serverUrl || !password || isQuietHours()) return;
  const quietFor = now - Math.max(lastActivity, lastTalk, lastInitiative);
  let händelse = '';
  if (pendingArrival && now - pendingArrival > 1500 && now - lastInitiative > INITIATIV.arrivalGapMs){
    händelse = firstSeenToday()
      ? 'Det är första gången du ser någon idag. Hälsa glatt på morgonen/dagen.'
      : 'Någon kom precis fram till dig efter en stund borta. Hälsa och bjud in till prat.';
    pendingArrival = 0;
  } else if (now - lastInitiative > INITIATIV.gapMs && quietFor > INITIATIV.quietMs){
    händelse = 'Någon är nära dig men det har varit tyst en stund (de kanske pysslar eller leker). Säg något kort och nyfiket som bjuder in till prat, utan att störa för mycket.';
  }
  if (!händelse) return;
  lastInitiative = now;
  store.set('lastday', todayKey());
  think('[Händelse: ' + händelse + ']', {thenListen: true});
}

// Snabb första reaktion på det barnet sa – innan hjärnan hunnit svara
const ORD = alts => new RegExp('(?:^|[^a-zåäö])(?:' + alts + ')');   // ordet måste börja där
const REAKTION = [
  ['ledsen',   ORD('ledsen|gråt|ont |slog mig|trilla|ramla|skadad|dog |död|saknar|tappade|sönder|arg på|bråk|retas')],
  ['rädd',     ORD('rädd|läskig|monster|spöke|mörkt|mardröm|åska')],
  ['skrattar', ORD('haha|hihi|bajs|prutt|fis |fisa|tokig|knasig|skämt|rolig')],
  ['förvånad', ORD('wow|oj |oj!|titta|kolla|gissa vad|vet du vad|jättestor|världens|vann |gjorde mål|fick en')],
  ['kär',      ORD('älskar|kram|puss|gillar dig|bästa vän|mysig')],
  ['glad',     ORD('grattis|födelsedag|jippi|hurra|yay|roligt|kul |glad |bra ')],
  ['nyfiken',  ORD('varför|hur |vad är|vem |vilken|vilket')],
];
function reactTo(text){
  const t = ' ' + String(text || '').toLowerCase() + ' ';
  if (/(bli |gör en|kan du (bli|blunda|göra|visa))/.test(t)) return null;   // ett önskemål – låt hjärnan göra det
  for (const [k, rx] of REAKTION) if (rx.test(t)) return k;
  return null;
}

// ---------- Tänk (fråga hjärnan) ----------
async function think(text, opts = {}){
  text = String(text || '').trim();
  if (!text || busy) return;
  if (!serverUrl || !password){ status('Fyll i server-adress och lösenord under ⚙'); panel.classList.add('open'); return; }
  busy = true; micBtn.classList.add('busy'); lastActivity = performance.now();
  if (/(prata|snacka|låta|tala)\s+(\S+\s+)?(som|med|likt)\s+(en\s+)?farfar|farfars röst|bli farfar/i.test(text)) setCostume('farfar');            // förvandlingen startar direkt
  else if (costume && /(prata|snacka|tala) svenska/i.test(text)) setCostume(null);
  if (opts.react){
    // visa en känsla direkt, tänk sen
    setEmotion(opts.react); sound(opts.react, {quiet: true, extra: true});
    setTimeout(() => { if (busy) setEmotion('tänker'); }, 1100);
  } else { setEmotion('tänker'); sound('tänker'); }
  const thinkLoop = setInterval(() => { if (Math.random() < .6) sound('tänker', {soft: true, extra: true}); }, 1400);
  history.push({role: 'user', content: text});
  let delar;
  try {
    const res = await callBrain({messages: history.slice(-12), kontext: kontext()});
    if (!res.ok) throw new Error((res.data.fel || ('fel ' + res.status)) + (res.data.detalj ? ' – ' + res.data.detalj : ''));
    delar = res.data.delar;
    if (res.data.minns) addMinnen(res.data.minns);
    if (res.data['läge'] === 'farfar') setCostume('farfar');
    else if (res.data['läge'] === 'normal' && costume) setCostume(null);
    // äldre hjärna (ett svar, en känsla) funkar också
    if (!Array.isArray(delar)) delar = [{'säg': res.data['säg'], 'känsla': res.data['känsla']}];
    delar = delar.filter(d => d && d['säg']);
    if (!delar.length) throw new Error('tomt svar');
  } catch(e){
    clearInterval(thinkLoop);
    history.pop();
    busy = false; micBtn.classList.remove('busy');
    setEmotion('neutral'); play([['ledsen', 2500]]); sound('fel');
    status('Hjärnan svarar inte: ' + e.message, 9000);
    if (convo) setTimeout(convoBackToListening, 2500);
    return;
  }
  clearInterval(thinkLoop);
  history.push({role: 'assistant', content: JSON.stringify({delar})});
  if (history.length > 20) history = history.slice(-20);

  busy = false; micBtn.classList.remove('busy');
  const k = await speakParts(delar);
  lastTalk = performance.now(); lastActivity = performance.now();
  if (opts.thenListen && !convo) autoListen();   // han tog initiativ – lyssna efter svar
  if (convo && HEJDA.test(text)){ setTimeout(() => endConvo(false), 600); }
  const hold = k === 'blunda' ? 20000 : (k === 'yr' || k === 'skrattar' || k === 'rasande' || k === 'jätteledsen') ? 3500 : convo ? 1800 : 2500;   // blunda = håll ögonen stängda en stund
  setTimeout(() => {
    if (busy || talking || tempActive || baseEmotion !== k) return;
    if (convo){ if (convo.phase === 'listen' || convo.phase === 'cool') setEmotion('lyssnar'); }
    else if (!listening) setEmotion('neutral');
  }, hold);
}

const BLOCKED = /[\u{1F346}\u{1F351}\u{1F4A6}\u{1F595}\u{1F51E}\u{1F48A}\u{1F489}\u{1FA78}\u{1F52A}\u{1F5E1}\u{26B0}\u{26B1}\u{1F480}\u{2620}\u{1F52B}\u{1F4A3}\u{1F37A}\u{1F37B}\u{1F377}\u{1F378}\u{1F379}\u{1F376}\u{1F6AC}\u{1F48B}\u{1F459}]/u;
function graphemes(s){

// Ett barn trycker på ett svar
function answer(btn, opt){
  if (busy) return;
  visaShownAt = performance.now(); lastActivity = performance.now();
  if (talking) stopTalking();
  const rätt = currentVisa && currentVisa['rätt'];
  btn.parentElement.querySelectorAll('button').forEach(b => b.disabled = true);
  if (rätt != null){
    if (opt === rätt){ btn.classList.add('ratt'); sound('stolt'); }
    else { btn.classList.add('fel'); sound('förvirrad', {soft: true}); }
  }
  setTimeout(() => think('Jag svarar: ' + opt), talking ? 400 : 250);
}

// ============================================================
//  SÅNG – Frank-Y sjunger med 8-bitars-melodi och robotnynnande
//  Bara fria (traditionella) sånger och egna sånger finns här.
// ============================================================
const TWINKLE = 'C4 C4 G4 G4 A4 A4 G4:2 | F4 F4 E4 E4 D4 D4 C4:2 | G4 G4 F4 F4 E4 E4 D4:2 | G4 G4 F4 F4 E4 E4 D4:2 | C4 C4 G4 G4 A4 A4 G4:2 | F4 F4 E4 E4 D4 D4 C4:2';
const SÅNGBOK = {
  // Gammal fri melodi – Frank-Y nynnar, barnen sjunger orden
  'blinka lilla stjärna': {titel: 'Blinka lilla stjärna', emoji: '⭐✨⭐', melodi: TWINKLE, bpm: 92},
  'bä bä vita lamm':      {titel: 'Bä, bä, vita lamm', emoji: '🐑🐑🐑', melodi: TWINKLE, bpm: 100},
  // Traditionella texter (fria) – familjen sjunger, Frank-Y visar orden och dansar.
  // Tryck på skärmen för att gå till nästa rad i egen takt.
  'ja må han leva': {titel: '🎂 Grattis! 🎂', emoji: '🎂🎉🎈', rader: p => [
      `Ja, må ${p} leva!\nJa, må ${p} leva!`, `Ja, må ${p} leva\nuti hundrade år!`,
      `Ja, visst ska ${p} leva!\nJa, visst ska ${p} leva!`, `Ja, visst ska ${p} leva\nuti hundrade år!`], hurra: true, sek: 6},
  'små grodorna': {titel: 'Små grodorna', emoji: '🐸🐸🐸', rader: () => [
      'Små grodorna, små grodorna\när lustiga att se.', 'Små grodorna, små grodorna\när lustiga att se.',
      'Ej öron, ej öron,\nej svansar hava de.', 'Ej öron, ej öron,\nej svansar hava de.',
      'Kou ack ack ack, kou ack ack ack,\nkou ack ack ack ack kaa!', 'Kou ack ack ack, kou ack ack ack,\nkou ack ack ack ack kaa!'], sek: 5},
};
const SÅNG_ALIAS = {'ja må hon leva': 'ja må han leva', 'ja må du leva': 'ja må han leva', 'ja må de leva': 'ja må han leva',
  'grattis': 'ja må han leva', 'blinka': 'blinka lilla stjärna', 'bä bä': 'bä bä vita lamm', 'grodorna': 'små grodorna'};

let song = null;   // pågående sång
function noteFreq(n){
  const m = /^([A-Ga-g])(#|b)?(\d)?$/.exec(n); if (!m) return 0;
  const base = {c:0, d:2, e:4, f:5, g:7, a:9, b:11}[m[1].toLowerCase()];
  const midi = 12 * ((m[3] ? +m[3] : 4) + 1) + base + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  return 440 * Math.pow(2, (midi - 69) / 12);
}
function parseMelody(str){        // "C4 D4 E4:2 | G4 ..." → rader med toner
  return String(str).split('|').map(line => line.trim().split(/\s+/).filter(Boolean).map(tok => {
    const [n, l] = tok.split(':'); return {f: noteFreq(n), beats: Math.min(4, Math.max(.5, parseFloat(l) || 1))};
  }).filter(x => x.f > 0)).filter(l => l.length);
}
function songTone(bus, t, f, dur){
  const a = ac;
  // 8-bitars-instrument
  const o = a.createOscillator(); o.type = 'square'; o.frequency.value = f;
  const g = a.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.05, t + .015);
  g.gain.exponentialRampToValueAtTime(.025, t + dur * .5); g.gain.exponentialRampToValueAtTime(.0001, t + dur * .95);
  o.connect(g).connect(bus); o.start(t); o.stop(t + dur);
  // robotens "dooo"-röst: sågtand genom ett vokalfilter, med lite vibrato
  const v = a.createOscillator(); v.type = 'sawtooth'; v.frequency.value = f;
  const lfo = a.createOscillator(); lfo.frequency.value = 5.5; const la = a.createGain(); la.gain.value = f * .012;
  lfo.connect(la).connect(v.frequency);
  const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 650; bp.Q.value = 2.5;
  const vg = a.createGain(); vg.gain.setValueAtTime(.0001, t); vg.gain.exponentialRampToValueAtTime(.22, t + .04);
  vg.gain.exponentialRampToValueAtTime(.0001, t + dur * .92);
  v.connect(bp).connect(vg).connect(bus); v.start(t); lfo.start(t); v.stop(t + dur); lfo.stop(t + dur);
}
function stopSong(){
  if (!song) return;
  const s = song; song = null;
  s.timers.forEach(clearTimeout);
  try { s.bus.gain.setTargetAtTime(0, ac.currentTime, .05); setTimeout(() => s.bus.disconnect(), 300); } catch(_){}
  visaEl.classList.remove('sing');
  s.done();
}
function showSongLine(emoji, text, small){
  showVisa({bild: emoji, text: ''});
  const t = visaInner.querySelector('.text') || el('div', {className: 'text'}, visaInner);
  t.textContent = text; t.style.whiteSpace = 'pre-line'; t.classList.toggle('liten', !!small);
  visaEl.classList.add('sing'); requestAnimationFrame(fitVisa);
}
function playSong(spec){
  return new Promise(resolve => {
    const a = audio(); if (!a){ resolve(); return; }
    stopSong();
    let def = null;
    if (spec.id){ const id = SÅNG_ALIAS[spec.id] || spec.id; def = SÅNGBOK[id]; }
    else if (Array.isArray(spec.rader)) def = {titel: spec.titel, emoji: safeBild(spec.emoji) || '🎵', egen: spec.rader, bpm: 104};
    if (!def){ resolve(); return; }
    const bus = a.createGain(); bus.gain.value = 1; bus.connect(a.destination);
    const s = song = {bus, timers: [], done: () => {}, next: null};
    const after = (ms, fn) => s.timers.push(setTimeout(() => { if (song === s) fn(); }, ms));
    s.done = () => { setEmotion(convo ? 'lyssnar' : 'neutral'); hideVisa(); resolve(); };
    setEmotion('sjunger');
    const finish = () => { if (song === s){ song = null; visaEl.classList.remove('sing'); s.done(); } };

    if (def.melodi || def.egen){
      // Melodi: Frank-Y spelar och nynnar
      const beat = 60 / (def.bpm || 100);
      const lines = def.egen ? def.egen.map(r => ({text: safeText(r.text), notes: parseMelody(r.noter)[0] || []}))
                             : parseMelody(def.melodi).map(n => ({text: '', notes: n}));
      let t = a.currentTime + .4, ms = 400;
      lines.forEach((line, i) => {
        const startMs = ms;
        after(startMs, () => showSongLine(def.emoji, line.text || (i === 0 ? def.titel : '🎵 Sjung med! 🎤'), !line.text && i > 0));
        line.notes.forEach(n => { songTone(bus, t, n.f, n.beats * beat * .95); t += n.beats * beat; ms += n.beats * beat * 1000; });
        t += beat * .5; ms += beat * 500;
      });
      after(ms + 300, finish);
    } else {
      // Sjung-med: visa raderna, familjen sjunger. Tryck på skärmen = nästa rad.
      const p = spec.namn ? (/ och |,|&/.test(spec.namn) ? 'de' : 'du') : 'han';
      const rader = def.rader(p);
      let i = -1;
      const step = () => {
        s.timers.forEach(clearTimeout); s.timers = [];
        i++;
        if (i < rader.length){
          showSongLine(def.emoji, (i === 0 && spec.namn ? safeText(spec.namn) + '\n' : '') + rader[i]);
          sound('glad', {soft: true});
          after(def.sek * 1000 + (i === 0 && spec.namn ? 1500 : 0), step);
        } else if (def.hurra){
          showSongLine('🎉🎂🎉', 'HURRA! HURRA!\nHURRA! HURRA!');
          setEmotion('skrattar');
          fetchVoice('Hurra! Hurra! Hurra! Hurra!').then(buf => {
            if (song !== s) return;
            if (buf) playRobotVoice(buf).catch(() => {}); else speak('Hurra! Hurra! Hurra! Hurra!');
          });
          sound('stolt');
          after(5000, finish);
        } else finish();
      };
      s.next = step;
      step();
    }
  });
}

async function speakParts(delar){
  talking = true; interrupted = false;
  convoTalking(true);
  const voices = delar.map(d => fetchVoice(clean(d['säg'])));   // hämta alla direkt, första spelas när den är klar
  let k = 'neutral';
  if (!delar.some(d => d.visa)) { if (visaOn) hideVisa(); }    // vanligt prat → bara ögon
  for (let i = 0; i < delar.length && !interrupted; i++){
    const d = delar[i]; const nk = norm(d['känsla']);
    if (d.visa) showVisa(d.visa);
    // Skyddsnät: en ny räknefråga utan ny bild → ta bort den gamla hellre än att visa fel
    else if (visaOn && /\?\s*$/.test(d['säg']) && /\d|\b(plus|minus|gånger)\b/i.test(d['säg'])) hideVisa();
    if (nk !== emotion || i === 0){
      setEmotion(nk);
      if (i === 0) sound(nk);
      else if (Math.random() < .5) sound(nk, {soft: true, extra: true});
    }
    k = nk;
    if (i === 0) await sleep(350);
    const buf = await voices[i];
    if (interrupted) break;
    let ok = false;
    if (buf){ try { await playRobotVoice(buf); ok = true; } catch(e){} }
    if (!ok && !interrupted) await speak(d['säg']);
    if (d['sång'] && !interrupted){ talking = true; await playSong(d['sång']); }
    if (i < delar.length - 1 && !interrupted) await sleep(220);
  }
  talking = false;
  if (interrupted){
    interrupted = false; speaking = false;
    if (convo){ convoTalking(false); return 'lyssnar'; }     // avbruten med rösten – lyssna på den som pratar
    setEmotion('neutral'); play([['förvånad', 600]]); return 'neutral';
  }
  convoTalking(false);
  // Ibland ett litet avslutande ljud – frågande "bip?" efter frågor
  const sist = String(delar[delar.length - 1]['säg'] || '').trim();
  if (sist.endsWith('?')){ if (Math.random() < .6) setTimeout(() => sound('fråga', {soft: true, extra: true}), 250); }
  else if (Math.random() < .25) setTimeout(() => sound('klart', {soft: true, extra: true}), 250);
  return k;
}

function mkInput(ph, val, type, onChange){
  const i = document.createElement('input');
  i.placeholder = ph; i.value = val; i.type = type; i.autocomplete = 'off';
  i.addEventListener('change', () => onChange(i.value.trim()));
  panel.appendChild(i);
}

  if (!serverUrl) return status('Fyll i server-adressen först', 6000);

  try {
    const res = await callBrain({messages: []});

});
